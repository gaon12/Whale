---
name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Biome and JavaScript checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit

      - name: Check formatting
        run: npm run format:check

      - name: Run Biome lint
        run: npm run lint

      - name: Check JavaScript syntax
        run: npm test

      - name: Install browser for integration tests
        run: npx playwright install --with-deps chromium

      - name: Test rendered browser behavior
        run: npm run test:browser

  php:
    name: PHPCS and PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit PHP dependencies
        run: composer audit

      - name: Run PHPCS
        run: composer test

      - name: Run PHPStan level max
        run: composer analyse

  mediawiki:
    name: MediaWiki ${{ matrix.mediawiki }} integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mediawiki: ['1.39', '1.43']
    env:
      WHALE_MEDIAWIKI_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # Keep the disposable core fixture independent of runner-default extensions.
          extensions: >-
            none, calendar, ctype, curl, dom, fileinfo, iconv, intl, mbstring,
            pdo_sqlite, simplexml, sqlite3, tokenizer, xml, xmlreader, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Install skin dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          npx playwright install --with-deps chromium
      - name: Install an isolated real MediaWiki wiki
        run: |
          export WHALE_MEDIAWIKI_FIXTURE="$RUNNER_TEMP/whale-mediawiki"
          echo "WHALE_MEDIAWIKI_FIXTURE=$WHALE_MEDIAWIKI_FIXTURE" >> "$GITHUB_ENV"
          bash scripts/install-mediawiki-fixture.sh '${{ matrix.mediawiki }}'
      - name: Exercise rendering, ResourceLoader, parsing and authenticated settings
        run: |
          php -S 127.0.0.1:8080 -t "$WHALE_MEDIAWIKI_FIXTURE" > "$RUNNER_TEMP/mediawiki-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail "$WHALE_MEDIAWIKI_BASE_URL/api.php?action=query&format=json" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:mediawiki
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mediawiki-${{ matrix.mediawiki }}-diagnostics
          path: |
            ${{ runner.temp }}/mediawiki-server.log
            ${{ runner.temp }}/whale-browser-tests
